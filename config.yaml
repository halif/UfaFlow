# UfaFlow example configuration
health_interval: 5         # seconds between backend TCP health checks
health_timeout: 2          # timeout for each backend connection check
frontends:
  - name: http_front
    listen_host: "127.0.0.1"
    listen_port: 8080
    algorithm: round_robin  # or least_conn
    backends:
      - name: app-1
        host: "127.0.0.1"
        port: 8001
        weight: 1
      - name: app-2
        host: "127.0.0.1"
        port: 8002
        weight: 2
